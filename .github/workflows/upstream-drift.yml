name: upstream-drift
# Fails when vendor/herdr-files/ differs from herdrdev/herdr-app master.
# Not part of ci: an upstream change must not fail unrelated pull requests.
on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: herdrdev/herdr-app
          ref: master
          path: upstream
          sparse-checkout: defaults/mods/files
      - run: echo "upstream master is $(git -C upstream rev-parse HEAD)"
      - run: bash scripts/check-upstream-drift.sh upstream
